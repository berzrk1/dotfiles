set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'mrjones2014/smart-splits.nvim'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-logging'

#  ━━━━━━━━━ Plugin Options ━━━━━━━━━
## tmux-logging
# Each command has its own path option (all default to $HOME)
set -g @logging-path               "~/Documents/tmux-logs" # prefix + P   (toggle logging)
set -g @screen-capture-path        "~/Documents/tmux-logs" # prefix + M-p (screen capture)
set -g @save-complete-history-path "~/Documents/tmux-logs" # prefix + M-P (save full history)
# Menu with all three commands on prefix + p
bind p display-menu -T "#[align=centre] Logging " -x C -y C \
  "#{?pane_pipe,Stop,Start} logging" l "run-shell ~/.config/tmux/plugins/tmux-logging/scripts/toggle_logging.sh" \
  "Screen capture"                   s "run-shell ~/.config/tmux/plugins/tmux-logging/scripts/screen_capture.sh" \
  "Save full history"                h "run-shell ~/.config/tmux/plugins/tmux-logging/scripts/save_complete_history.sh"

## tmux-yank
set -g @yank_action 'copy-pipe' # stay in copy mode after yanking (default: copy-pipe-and-cancel)

## smart-splits
set -g @smart-splits_no_wrap '' # to disable wrapping. (any value disables wrapping)

set -g @smart-splits_move_left_key  'C-h' # key-mapping for navigation.
set -g @smart-splits_move_down_key  'C-j' #  --"--
set -g @smart-splits_move_up_key    'C-k' #  --"--
set -g @smart-splits_move_right_key 'C-l' #  --"--

set -g @smart-splits_resize_step_size '3' # change the step-size for resizing.
