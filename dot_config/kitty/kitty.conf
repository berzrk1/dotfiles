#  ━━━━━━━━━ Startup ━━━━━━━━━
# Attach to (or create) the "main" tmux session in every new window;
# after detaching, drop into the login shell instead of closing the window
shell sh -c 'tmux new-session -A -s main; exec "$SHELL" -l'
confirm_os_window_close 0

#  ━━━━━━━━━ Font ━━━━━━━━━
font_family FantasqueSansM Nerd Font Mono
font_size   16.0

#  ━━━━━━━━━ Window ━━━━━━━━━
background_opacity 0.8
background_blur    1
window_padding_width 1
# tmux handles tabs and splits
tab_bar_style hidden

#  ━━━━━━━━━ Bell ━━━━━━━━━
enable_audio_bell no
visual_bell_duration 0

#  ━━━━━━━━━ Theme: Carl (ported from Konsole) ━━━━━━━━━
foreground #ffffff
background #111216

color0  #484848
color8  #6d6d6d
color1  #f13460
color9  #da2f57
color2  #269e9c
color10 #238f8b
color3  #ec2e90
color11 #c22e80
color4  #3872ee
color12 #356eb9
color5  #b031b4
color13 #a32ea7
color6  #57bcc5
color14 #4eaab1
color7  #6fa67c
color15 #608f6b
