custom.make = { detect_files = ["Makefile", "makefile", "GNUmakefile"], command = "make --version | awk 'NR==1 { print $3 }'", shell = ["sh"], symbol = "", format = "[ $symbol( $output) ](fg:fg bg:pill) " }

[palettes.neofusion]
fg = "#e2d9c5"
muted = "#3e7a9b"
cyan = "#66def9"
blue = "#35b5ff"
orange = "#fd5e3a"
pink = "#ec30ac"
red = "#f13460"
green = "#269e9c"
pill = "#08435e"

#  ━━━━━━━━━ Who / where ━━━━━━━━━
[username]
disabled = true

[custom.root] # alert box when running as root
when = "test \"$(id -u)\" -eq 0"
shell = ["sh"]
format = "[ ROOT ]($style) "
style = "bold fg:#06101e bg:red"

[custom.venv] # active virtualenv, like (venv) in bash
when = "test -n \"$VIRTUAL_ENV\""
command = "basename \"$VIRTUAL_ENV\""
shell = ["sh"]
format = "[\\($output\\)]($style) "
style = "green"

[hostname]
disabled = true

[custom.vpn] # HTB/THM VPN address
when = "test -d /sys/class/net/tun0"
command = "ip -4 -o addr show tun0 | awk '{ sub(/\\/.*/, \"\", $4); print $4 }'"
shell = ["sh"]
os = "linux"
format = "[󰖂 $output]($style) "
style = "bold orange"

[directory]
truncation_length = 4
truncation_symbol = "…/"
format = "[\\[](muted)[$path]($style)[$read_only]($read_only_style)[\\]](muted) "
read_only = " 󰌾"
style = "bold blue"

#  ━━━━━━━━━ Git ━━━━━━━━━
[git_branch]
format = "[$symbol$branch(:$remote_branch)]($style)"
symbol = " "
style = "pink"

[git_state]
format = "( [$state( $progress_current/$progress_total)]($style))"
style = "bold orange"

[git_metrics]
disabled = false
format = "( [\\(](muted)([+$added]($added_style))( [-$deleted]($deleted_style))[\\)](muted))"
added_style = "green"
deleted_style = "red"

[custom.git_modified] # modified files, shown before git_metrics (git_status order is fixed)
require_repo = true
when = true
command = "git diff --name-only | wc -l | awk '$1 > 0 { print $1 }'"
shell = ["sh"]
format = "( [ $output](orange))"

[git_status]
format = "([$all_status$ahead_behind]($style))"
conflicted = " [󱡂](bold red)"
untracked = " [$count](pink)"
staged = " [$count](green)"
modified = "" # shown by custom.git_modified
renamed = " [󰬴 $count](blue)"
deleted = " [$count](red)"
stashed = " [ $count](cyan)"
ahead = " [$count](green)"
behind = " [$count](orange)"
diverged = " [$ahead_count$behind_count](red)"

#  ━━━━━━━━━ Tools ━━━━━━━━━
[package]
disabled = true

[sudo] # sudo credentials are cached
disabled = false
format = "[$symbol]($style)"
symbol = "󰌋 "
style = "bold red"

#  ━━━━━━━━━ Command result ━━━━━━━━━
[status]
disabled = false
format = "[$symbol$status]($style) "
symbol = "✘ "
pipestatus = true
pipestatus_format = "[$symbol$pipestatus]($style) "
pipestatus_segment_format = "$status"
pipestatus_separator = "|"
style = "red"

[cmd_duration]
min_time = 2000
format = "[󰔟 $duration]($style) "
style = "muted"

[time] # timestamps for engagement notes/screenshots
disabled = false
format = "[$time]($style)"
time_format = "%H:%M:%S"
style = "muted"

[jobs]
style = "pink"

[fill] # pushes the rest of line 1 to the right edge
symbol = " "

[character] # the connector is the prompt; red after a failure
success_symbol = "[╰─](muted)"
error_symbol = "[╰─](bold red)"
vimcmd_symbol = "[╰─](bold green)"
