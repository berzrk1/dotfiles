"$schema" = 'https://starship.rs/config-schema.json'

palette = "neofusion"

format = """
[╭─](muted)${custom.root}${custom.venv}${custom.vpn}$directory$all($git_branch$git_state${custom.git_modified}$git_metrics$git_status )\
$fill$jobs$status$cmd_duration$time\
$line_break$character"""

# Languages: square pill with version
buf = { symbol = "", format = "[ $symbol( $version) ](fg:fg bg:pill) ", version_format = "${raw}" }
